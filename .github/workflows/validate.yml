name: Validate static site

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check config.js
          node --check weekly/weekly.js
          node --check weekly/cumulative.js
          node --check admin/app.js

      - name: Validate content JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path("content/diseases.sample.json"), Path("content/questions.sample.json")]:
              with path.open(encoding="utf-8") as f:
                  json.load(f)
              print(f"OK: {path}")
          PY
