name: Validate static site

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check config.js
          node --check weekly/weekly.js
          node --check weekly/cumulative.js
          node --check weekly/weekly-scene.js
          node --check scripts/validate_daily_archive.cjs
          node --check admin/app.js
          node --check scripts/security_static_checks.cjs
          node --check scripts/public_browser_smoke.cjs
          node --check content/disease-guides.js
          node --check disease/disease.js
          node --check contact/contact.js
          node --check scripts/validate_disease_guides.cjs
          node --check scripts/validate_disease_guides_extra.cjs
          node --check scripts/validate_disease_guides_currently_lit.cjs
          node --check scripts/validate_disease_guides_extra100_20261012.cjs
          node --check scripts/validate_disease_guides_extra100_batch2_20261012.cjs
          node --check scripts/validate_disease_guides_orpha100_20261012.cjs
          node --check scripts/validate_disease_guides_orpha_next100_20261012.cjs
          node --check scripts/validate_dynamic_disease_guides.cjs
          node --check admin/analytics.js
          node --check scripts/stage_orpha_hpo_evidence.cjs
          node --check lab/scene.js
          node --check glow-preview/glow.js
          node --check scripts/validate_glow_preview.cjs
          node --check scripts/validate_nebula_f_main.cjs
          node --check scripts/build_pilot_coords.cjs
          node --check scripts/build_hpo_pilot.cjs
          node --check scripts/build_orpha_candidates.cjs

      - name: Validate content JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path("content/diseases.sample.json"), Path("content/questions.sample.json")]:
              with path.open(encoding="utf-8") as f:
                  json.load(f)
              print(f"OK: {path}")
          PY

      - name: Validate NANDO Japanese catalog snapshot
        run: |
          python - <<'PY'
          import json, csv, re, unicodedata
          from pathlib import Path
          rows=json.loads(Path('data/nando_subtypes_2023_import.json').read_text(encoding='utf-8'))['records']
          assert len(rows)==655, f"expected 655 imported disease subtypes, got {len(rows)}"
          normalize=lambda s: re.sub(r'[\s・･‐‑‒–—―－_（）()／/-]', '', unicodedata.normalize('NFKC',s).lower())
          names=[normalize(r['name_ja']) for r in rows]
          assert len(names)==len(set(names)), 'Duplicate normalized Japanese name in imported subtypes'
          assert all(re.search('[ぁ-んァ-ヶ一-龯]',r['name_ja']) for r in rows), 'Untranslated label'
          assert all(r['parent_disease_id'] for r in rows), 'Missing designated parent'
          links=list(csv.DictReader(Path('data/nando_external_id_crosswalk.csv').open(encoding='utf-8')))
          assert len(links)==1005 and len({v['source_id'] for v in links})==1005, 'Source code mismatch'
          mapped={v['disease_id'] for v in links}
          assert {v['id'] for v in rows}<=mapped, 'Subtype without source mapping'
          print('NANDO import snapshot / crosswalk / labels: OK')
          PY

      - name: Check exhibition page links and required controls
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Collector(HTMLParser):
              def __init__(self):
                  super().__init__();self.ids=set();self.references=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if 'id' in a: self.ids.add(a['id'])
                  if tag in ('script','link') and a.get('src',a.get('href','')).startswith(('./','../')):
                      self.references.append(a.get('src',a.get('href')).split('?')[0])
          for f in ['index.html','admin/index.html','weekly/index.html','privacy/index.html','lab/index.html','clinical/index.html','disease/index.html','contact/index.html']:
              parser=Collector();parser.feed(Path(f).read_text())
              for ref in parser.references:
                  assert (Path(f).parent/ref).resolve().is_file(), f'{f}: missing {ref}'
          contact=Path('contact/index.html').read_text()
          assert 'id="contact-form"' in contact and 'id="contact-message"' in contact
          assert 'id="contact-email"' in contact and 'id="contact-send"' in contact
          home_markup=Path('index.html').read_text()
          assert 'href="./contact/"' in home_markup and 'href="./weekly/"' in home_markup
          assert '1ブラウザにつき1日1回' not in home_markup
          assert 'map-disclaimer' not in home_markup
          parser=Collector();parser.feed(home_markup)
          for required in ['flow-modal','suggest-toggle','suggest-panel','suggest-name','suggest-send',
                           'suggest-status','open-form','step-disease','thought-text','finish-flow']:
              assert required in parser.ids, f'missing {required}'
          for required in ['universe','reset-view','toggle-motion','lit-count',
                           'star-info','info-name','info-comments','map-status']:
              assert required in parser.ids, f'missing 3D main control {required}'
          assert 'data-star-scene="taxonomy"' in Path('index.html').read_text()
          research=Path('clinical/index.html').read_text()
          assert 'data-star-scene="clinical"' in research
          assert 'mode-taxonomy' not in research and 'mode-clinical' not in research
          assert 'mode-clinical' not in Path('index.html').read_text()
          assert 'data-star-scene' not in Path('lab/index.html').read_text()
          assert 'url=../' in Path('lab/index.html').read_text()
          assert 'url=../#participation' in Path('admin/index.html').read_text()
          shared=Path('lab/scene.js').read_text()
          assert "client.rpc('get_constellation_positions')" in shared
          assert "client.rpc('get_private_clinical_positions')" in shared
          assert "data.length!==1241" in shared
          assert 'get_public_stars' in shared
          assert 'join-selected-star' in parser.ids
          assert 'NENONE_START_FOR_DISEASE' in shared
          assert 'NENONE_START_FOR_DISEASE=openFlowForSelectedStar' in Path('admin/app.js').read_text()
          assert 'href="./clinical/"' not in Path('index.html').read_text()
          assert "get_daily_constellation" in Path('weekly/cumulative.js').read_text()
          assert 'weekly-space' in Path('weekly/index.html').read_text()
          assert 'weekly-selected-info' in Path('weekly/index.html').read_text()
          assert 'weekly-space-print' in Path('weekly/index.html').read_text()
          assert 'get_constellation_positions' in Path('weekly/weekly-scene.js').read_text()
          assert 'clouds.filter(c=>c.userData.selectable)' in Path('weekly/weekly-scene.js').read_text()
          assert 'objects.filter(o=>o.userData.pickable)' in shared
          assert "Number(starData.get(id)?.total)>0" in shared
          assert 'get_private_clinical_positions' in shared
          assert 'get_clinical_pilot_positions' not in shared
          assert 'id="clinical-access"' in research
          assert 'noindex,nofollow' in research
          guard=Path('supabase/migrations/044_private_clinical_preview.sql').read_text()
          assert 'revoke all on function public.get_clinical_pilot_positions()' in guard
          assert 'public.clinical_research_viewers' in guard
          assert 'grant execute on function public.get_private_clinical_positions()' in guard
          historical=Path('supabase/migrations/045_historical_weekly_3d_counts.sql').read_text()
          assert "p_week_start::timestamp at time zone 'Asia/Tokyo'" in historical
          assert 'e.created_at<t.dt' in historical
          assert 'i.created_at<t.dt' in historical
          print('Private clinical preview, lit-only hit targets and historical weekly 3D verified')
          print('Separated 1241 home / clinical research and participant controls: OK')
          PY

      - name: Reproduce pilot PCA and fuzzy-cluster positions
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const {calculate}=require('./scripts/build_pilot_coords.cjs');
          const input=JSON.parse(fs.readFileSync('data/pilot_3d_feature_input.json','utf8')).rows;
          const expected=JSON.parse(fs.readFileSync('data/pilot_3d_positions.json','utf8')).positions;
          const {coordinates,variance,iterations}=calculate(input);
          assert.equal(input.length,1241);
          assert.equal(coordinates.length,1241);
          let different=0;
          for(let i=0;i<coordinates.length;i++){
            const a=coordinates[i],b=expected[i];
            assert.equal(a.id,b.id);
            for(const key of ['x','y','z','fuzzy_cluster','membership_strength','coverage_kind']){
              if(a[key]!==b[key])different++;
            }
          }
          assert.equal(different,0,'Generated positions differ from versioned snapshot');
          assert.equal(coordinates.filter(x=>x.coverage_kind==='unclassified').length,20);
          assert(variance.every(x=>Number.isFinite(x)&&x>=0&&x<=1));
          console.log('3D pilot PCA+FCM match:',coordinates.length,'clusters; iterations:',iterations);
          JS

      - name: Validate exact Orphadata identity and clinical PCA FCM pilot
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const {embedding}=require('./scripts/build_hpo_pilot.cjs');
          const records=[1,2,3].flatMap(i=>JSON.parse(
           fs.readFileSync('data/orphadata_verified_batch_0'+i+'.json','utf8')).rows);
          const expected=JSON.parse(fs.readFileSync('data/clinical_hpo_pca_fcm_17.json','utf8'));
          assert.equal(records.length,17);
          assert.equal(new Set(records.map(r=>r.id)).size,17);
          assert.equal(new Set(records.map(r=>r.code)).size,17);
          for(const row of records){
            assert(['exact_label','exact_synonym','punctuation_verified'].includes(row.match));
            assert(row.phenotypes.length>0);
            assert(row.phenotypes.every(p=>/^HP:\d{7}$/.test(p.id)));
          }
          const actual=embedding(records);
          assert.equal(actual.meta.n,17);
          assert.equal(actual.meta.hpoTermCount,474);
          assert.equal(actual.meta.causalGeneCount,32);
          assert.deepEqual(actual.coordinates,expected.coordinates);
          assert(actual.meta.explainedKernelVariance.every(v=>v>0&&v<1));
          console.log('Verified ORPHA identities / HPO phenotype embeddings: OK');
          JS

      - name: Validate conservative whole-catalog ORPHA crosswalk audit
        run: |
          python - <<'PY'
          import json
          from collections import Counter,defaultdict
          from pathlib import Path
          data=json.loads(Path('data/orpha_matching_candidates.json').read_text())
          summary=data['summary']
          rows=data['records']
          assert summary['total']==1241
          assert len(rows)==summary['total']
          assert len({r['id'] for r in rows})==1241
          assert Counter(r['status'] for r in rows)=={
              'missing_english_name':389,
              'unique_exact_candidate':275,
              'review_required':56,
              'not_matched':521,
          }
          assert len(data['metadata']['upstream_commit'])==40
          source_codes=defaultdict(list)
          for r in rows:
              if r['status']=='unique_exact_candidate':
                  assert r['candidate']['match'] in ('exact_label','exact_synonym')
                  source_codes[r['candidate']['code']].append(r['id'])
          assert all(len(v)==1 for v in source_codes.values()), 'Cross-disease ORPHA collision'
          print('No user data; exact ORPHA candidate audit is internally consistent.')
          PY

      - name: Validate UMAP comparison and ORPHA identity-review boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def load(name): return json.loads(Path('data',name).read_text())
          report=load('clinical_model_comparison_summary_v1.json')
          verified=load('clinical_verified_comparison_v1.json')
          staging=load('clinical_staged_unreviewed_comparison_v1.json')
          identity=load('orpha_hierarchy_review_queue_v1.json')
          assert len(verified['positions'])==17
          assert len(staging['positions'])==133
          assert all(r['identity_status']=='reviewed' for r in verified['positions'])
          assert all(r['identity_status']=='unreviewed' for r in staging['positions'])
          assert report['no_unreviewed_promoted']
          assert report['identity_crosswalk']['staged_verified_overlap']==11
          assert identity['stats']['total']==133
          assert identity['stats']['pending']==122
          assert identity['stats']['auto_approved']==0
          assert identity['stats']['parent_name_exact']==9
          assert identity['stats']['subtype_to_orpha_disease']==125
          assert all(r['orpha_url'].startswith('https://www.orpha.net/en/disease/detail/')
            for r in identity['records'])
          assert report['evaluation']['verified']['method_metrics']['UMAP']['trustworthiness']>0.7
          print('Reviewed 17 vs staged 133 remain disjoint in publication')
          PY

      - name: Validate independent ORPHA evidence and two 3D model scopes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,math
          def load(name): return json.loads(Path('data',name).read_text())
          source4=load('orphadata_verified_batch_04.json')['rows']
          source5=load('orphadata_verified_batch_05.json')['rows']
          audit=load('orpha_ancestor_chain_audit_v1.json')
          verified=load('clinical_verified_comparison_v3.json')
          pending=load('clinical_pending_unreviewed_comparison_v3.json')
          summary=load('clinical_model_comparison_summary_v3.json')
          base=load('pilot_3d_positions.json')['positions']
          assert len(source4)==22 and len(source5)==11
          assert len({r['id'] for r in source4+source5})==33
          assert len({r['code'] for r in source4+source5})==33
          corroborated={r['disease_id']:r for r in audit['records'] if r['min_parent_match_depth'] is not None}
          assert len(corroborated)==33
          assert all(r['id'] in corroborated and r['code']==corroborated[r['id']]['orpha_code'] for r in source4+source5)
          assert len(verified['positions'])==50 and len(pending['positions'])==89
          assert len(base)==1241
          ids={r['id'] for r in verified['positions']}
          assert len(ids)==50 and ids.isdisjoint(r['id'] for r in pending['positions'])
          assert {r['identity_status'] for r in verified['positions']}=={'reviewed'}
          assert {r['identity_status'] for r in pending['positions']}=={'unreviewed'}
          assert all(math.isfinite(r[a]) and abs(r[a])<=30 for r in verified['positions'] for a in ('x','y','z'))
          assert summary['no_unreviewed_promoted'] and summary['identity_crosswalk']['source_candidates_already_reviewed']==44
          print('ORPHA identity evidence and 50 verified / 89 pending / 1241 taxonomy kept separate')
          PY

      - name: Verify clinical 120 and taxonomy 1241 remain distinct
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def rd(p):return json.loads(Path('data',p).read_text())
          evidence=rd('orpha_mondo_crosswalk_evidence_v1.json')['matches']
          batch=rd('orphadata_verified_batch_06.json')['rows']
          verified=rd('clinical_verified_comparison_v4.json')['positions']
          pending=rd('clinical_pending_unreviewed_comparison_v4.json')['positions']
          summary=rd('clinical_model_comparison_summary_v4.json')
          taxonomy=rd('pilot_3d_positions.json')['positions']
          assert len(evidence)==70 and len(batch)==70
          assert len(verified)==120 and len(pending)==19 and len(taxonomy)==1241
          assert len({x['id'] for x in verified})==120
          assert len({x['orpha_code'] for x in verified})==120
          assert {x['id'] for x in verified}.isdisjoint(x['id'] for x in pending)
          assert {x['identity_status'] for x in verified}=={'reviewed'}
          assert {x['identity_status'] for x in pending}=={'unreviewed'}
          assert summary['identity_crosswalk']['source_candidates_already_reviewed']==114
          assert all(len({a['mondo_id'] for a in x['evidence']})==1 for x in evidence)
          assert all(all(e['mondo_to_orpha_predicate']=='skos:exactMatch' for e in x['evidence']) for x in evidence)
          assert all(x['model_version']=='clinical-hpo-gene-inheritance-onset-3d-v4-umap' for x in verified)
          print('clinical 120 and 19 candidate identities isolated; taxonomy 1241 preserved')
          PY

      - name: Check all 1241 sourced numeric profiles and clinical observation masks
        run: |
          node --check scripts/stage_mondo_full_catalog.cjs
          python - <<'PY'
          from pathlib import Path
          import json,math
          def load(name):return json.loads(Path('data',name).read_text())
          catalogue=load('orpha_matching_names_public.json')['rows']
          taxonomy=load('pilot_3d_positions.json')['positions']
          stage=load('full_catalog_mondo_orpha_candidate_evidence_v1.json')['candidates']
          additional=load('orphadata_verified_batch_07.json')['rows']
          medical=load('clinical_verified_comparison_v5.json')['positions']
          pending=load('clinical_pending_unreviewed_comparison_v5.json')['positions']
          assert len(catalogue)==1241 and len(taxonomy)==1241
          assert len({x['id'] for x in taxonomy})==1241
          assert len(stage)==75
          assert len({x['orpha_code'] for x in stage})==75
          assert len(additional)==24
          assert all(x['id'].startswith('nando-') for x in additional)
          assert all(x['id'] in {c['disease_id'] for c in stage} for x in additional)
          assert len(medical)==144 and len(pending)==19
          assert len({x['id'] for x in medical})==144
          assert {x['id'] for x in medical}.isdisjoint(x['id'] for x in pending)
          assert all(x['model_version']=='clinical-hpo-gene-inheritance-onset-3d-v5-umap' for x in medical)
          assert all(math.isfinite(x[d]) and abs(x[d])<=30 for x in medical for d in ('x','y','z'))
          schema=Path('supabase/migrations/036_numeric_feature_profiles_schema.sql').read_text()
          seeds=Path('supabase/migrations/038_populate_all_numeric_features.sql').read_text()
          assert 'observed_mask jsonb not null' in schema
          assert 'where weight is not null' in seeds
          assert 'if (select count(*) from public.disease_numeric_feature_profiles)' in seeds
          assert 'from generate_series(1,34)' in seeds
          print('1241 category vectors, 144 research HPO links, 75 private review candidates, 19 older pending preserved')
          PY

      - name: Source-linked discovery top-50 article checks
        run: |
          node scripts/validate_disease_guides.cjs
          node scripts/validate_disease_guides_extra.cjs
          node scripts/validate_disease_guides_currently_lit.cjs
          node scripts/validate_disease_guides_extra100_20261012.cjs
          node scripts/validate_disease_guides_extra100_batch2_20261012.cjs
          node scripts/validate_disease_guides_orpha100_20261012.cjs
          node scripts/validate_disease_guides_orpha_next100_20261012.cjs
          node scripts/validate_dynamic_disease_guides.cjs
          node scripts/validate_daily_archive.cjs

      - name: Python Japanese article character audit
        run: |
          python scripts/audit_guide_text_lengths.py
          python scripts/audit_guide_extra100_20261012.py
          python scripts/audit_guide_extra100_batch2_20261012.py
          python scripts/audit_orpha100_text_lengths.py
          python scripts/audit_orpha_next100_text_lengths.py

      - name: Check unlisted six-way glow preview
        run: node scripts/validate_glow_preview.cjs

      - name: Verify live glow is exact preset F
        run: node scripts/validate_nebula_f_main.cjs

      - name: Static security regression for public site and RPC boundaries
        run: node scripts/security_static_checks.cjs
