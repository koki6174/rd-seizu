name: Compare clinical embeddings (PCA UMAP FCM)
on:
  push:
    branches: [feature/clinical-umap-pca-fcm-benchmark]
    paths:
      - "scripts/compare_clinical_embedding.py"
      - ".github/workflows/clinical-compare.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install reproducible analysis environment
        run: |
          python -m pip install "numpy==2.1.3" "scipy==1.15.3" "scikit-learn==1.6.1" "umap-learn==0.5.7"
      - name: Verify syntax and compute embeddings
        env:
          NUMBA_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          PYTHONHASHSEED: "0"
        run: |
          python -m py_compile scripts/compare_clinical_embedding.py
          python scripts/compare_clinical_embedding.py --output data
      - name: Verify strict identity separation and 3D coordinate bounds
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          v=json.loads(Path('data/clinical_verified_comparison_v1.json').read_text())
          c=json.loads(Path('data/clinical_staged_unreviewed_comparison_v1.json').read_text())
          summary=json.loads(Path('data/clinical_model_comparison_summary_v1.json').read_text())
          assert len(v['positions'])==17 and len(c['positions'])==133
          assert {x['identity_status'] for x in v['positions']}=={'reviewed'}
          assert {x['identity_status'] for x in c['positions']}=={'unreviewed'}
          assert summary['no_unreviewed_promoted'] and summary['never_overwrite_taxonomy_map']
          for obj in (v,c):
              assert len({p['id'] for p in obj['positions']})==len(obj['positions'])
              for p in obj['positions']:
                  assert all(math.isfinite(p[a]) and abs(p[a])<30 for a in ('x','y','z'))
                  assert 0<=p['membership']<=1
          print('OK: verified clinical positions isolated from unreviewed candidate geometry')
          PY
      - name: Store reproducible output in branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/clinical_verified_comparison_v1.json data/clinical_staged_unreviewed_comparison_v1.json data/clinical_model_comparison_summary_v1.json
          if ! git diff --cached --quiet; then
            git commit -m "research: compare phenotype clinical PCA UMAP FCM and stage coordinates"
            git push origin HEAD:feature/clinical-umap-pca-fcm-benchmark
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: clinical-embedding-method-comparison
          path: |
            data/clinical_verified_comparison_v1.json
            data/clinical_staged_unreviewed_comparison_v1.json
            data/clinical_model_comparison_summary_v1.json
          retention-days: 14
