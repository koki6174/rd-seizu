name: Identify source-backed missing disease guides
on:
  push:
    branches: [feature/expand-disease-guides-100-20261012-c]
    paths:
      - scripts/audit_pending_guide_candidates.cjs
      - .github/workflows/audit-more-guides.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  identify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/audit_pending_guide_candidates.cjs
      - name: Commit investigation snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/guide_candidate_audit_20261012.json
          if ! git diff --cached --quiet; then
            git commit -m "research: inventory unpublished clinical guide candidates and sources"
            git push origin HEAD:feature/expand-disease-guides-100-20261012-c
          fi
