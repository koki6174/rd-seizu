<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080e20">
  <meta name="description" content="見えない病気の星図へのお問い合わせ窓口。">
  <title>お問い合わせ | 見えない病気の星図</title>
  <link rel="stylesheet" href="./contact.css?v=1">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"></script>
  <script defer src="../config.js"></script>
  <script defer src="./contact.js?v=1"></script>
</head>
<body>
  <main>
    <a class="back" href="../">← 星図に戻る</a>
    <section class="contact-panel">
      <span class="overline">CONTACT</span>
      <h1>お問い合わせ</h1>
      <p class="intro">お問い合わせしたいことを書いてください。展示の感想、サイトの不具合、掲載内容に関するご連絡などを受け付けています。</p>
      <form id="contact-form">
        <label for="contact-message">お問い合わせ内容 <span class="required">必須</span></label>
        <textarea id="contact-message" name="message" maxlength="2000" minlength="3" rows="8" required placeholder="お問い合わせ内容をご記入ください。"></textarea>
        <p class="field-note">3〜2,000文字。病歴や個人を特定できる情報は、必要がなければ入力しないでください。</p>
        <label for="contact-email">返信先メールアドレス <span class="optional">任意</span></label>
        <input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="返信を希望する場合に入力">
        <p class="field-note">未入力でも送信できます。返信は保証されません。</p>
        <div class="honeypot" aria-hidden="true"><label for="contact-website">Website</label><input id="contact-website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
        <p class="privacy">送信した内容と返信先メールアドレスは運営担当者のみが確認し、サイトには公開されません。詳しくは<a href="../privacy/">プライバシーポリシー</a>をご覧ください。</p>
        <button class="submit" id="contact-send" type="submit">お問い合わせを送信する <span aria-hidden="true">→</span></button>
        <p id="contact-status" class="status" role="status" aria-live="polite"></p>
      </form>
      <div id="contact-complete" class="complete" hidden>
        <h2>お問い合わせを受け付けました。</h2>
        <p>内容は運営担当者が確認します。ご連絡ありがとうございました。</p>
        <a class="return" href="../">星図へ戻る →</a>
      </div>
    </section>
  </main>
  <footer>知ることから、つながりへ。</footer>
</body>
</html>
