<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080e1d">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="みんなでつくる「見えない病気の星図」は現在公開準備中です。">
  <title>公開準備中 | 見えない病気の星図</title>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="./config.js"></script>
  <script defer src="./admin/analytics.js?v=2"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      color: #eef5ff;
      background: #080e1d;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      position: relative;
      isolation: isolate;
      background:
        radial-gradient(ellipse 50% 42% at 54% 36%, rgba(35,107,132,.23), transparent 85%),
        radial-gradient(ellipse 37% 47% at 18% 78%, rgba(84,52,124,.16), transparent 85%),
        linear-gradient(156deg, #070d1c 6%, #0c1530 52%, #060c19 100%);
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(236,249,255,.58) .8px, transparent 1.3px);
      background-size: 67px 79px;
      background-position: 19px 26px;
      opacity: .22;
      z-index: -1;
    }
    .sky {
      position: absolute;
      width: min(1050px, 125vw);
      height: auto;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -52%);
      pointer-events: none;
      opacity: .5;
      z-index: -1;
    }
    .sky line { stroke: #78c7e2; stroke-width: .85; opacity: .36; }
    .sky .star { fill: #bdedff; }
    .sky .halo { fill: #8de4ee; opacity: .09; }
    .panel {
      width: min(680px, calc(100% - 38px));
      padding: clamp(34px, 7.3vw, 76px) clamp(24px, 7vw, 66px);
      margin: 42px auto;
      text-align: center;
      border: 1px solid rgba(177,221,237,.13);
      border-radius: 26px;
      background: linear-gradient(145deg, rgba(15,26,49,.78), rgba(9,17,35,.64));
      box-shadow: 0 32px 100px rgba(0,0,0,.32), inset 0 1px 0 rgba(231,252,255,.07);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }
    .symbol {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      margin: 0 auto 25px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 45%, rgba(92,224,238,.24), rgba(92,224,238,.025) 73%);
      color: #9debf2;
      font-size: 46px;
      font-weight: 300;
      line-height: 1;
      box-shadow: 0 0 64px rgba(66,201,218,.12);
    }
    .eyebrow {
      margin: 0 0 20px;
      color: #9dd8e5;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .25em;
    }
    h1 {
      margin: 0;
      font: 600 clamp(42px, 8.7vw, 76px)/1.15 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      letter-spacing: -.035em;
      color: #f4fbff;
    }
    .accent {
      width: 80px;
      height: 2px;
      margin: 30px auto 31px;
      background: linear-gradient(90deg, transparent, #7be6e9, transparent);
    }
    h2 {
      margin: 0;
      font-size: clamp(18px, 3.9vw, 23px);
      font-weight: 600;
      line-height: 1.75;
      letter-spacing: .045em;
    }
    .description {
      margin: 16px 0 0;
      color: #b0bfd3;
      font-size: clamp(13px, 2.8vw, 15px);
      line-height: 2.1;
    }
    .project {
      margin-top: 39px;
      padding-top: 23px;
      border-top: 1px solid rgba(191,224,239,.14);
      font-size: clamp(12px, 2.7vw, 14px);
      line-height: 1.9;
      letter-spacing: .05em;
      color: #d3e6f4;
    }
    .project strong { font-weight: 600; }
    .footnote {
      margin: 12px 0 0;
      color: #7e91aa;
      font-size: 11px;
      letter-spacing: .05em;
    }
    @media (max-width: 520px) {
      .panel { border-radius: 20px; }
      .symbol { margin-bottom: 20px; }
      .accent { margin: 25px auto; }
      .project { margin-top: 30px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .symbol { animation: breathe 4s ease-in-out infinite; }
      @keyframes breathe {
        0%, 100% { box-shadow: 0 0 35px rgba(66,201,218,.08); }
        50% { box-shadow: 0 0 70px rgba(66,201,218,.22); }
      }
    }
    /* Reduced visual effects for a quieter single-purpose landing page. */
    .panel{background:rgba(12,21,41,.72);box-shadow:none;border:1px solid rgba(177,221,237,.1);padding:clamp(40px,8vw,78px) clamp(26px,7vw,70px)}
    .symbol{width:56px;height:56px;font-size:38px;margin-bottom:20px;box-shadow:none}
    h1{font-size:clamp(39px,8vw,64px);font-weight:650;letter-spacing:-.03em}
    h2{font-size:clamp(19px,3.7vw,24px);line-height:1.65;letter-spacing:0}
    .description{font-size:14px;line-height:1.8}
    .project{margin-top:32px}
    .footnote a{color:#a7c9d4;text-decoration:underline;text-underline-offset:3px}
  </style>
</head>
<body>
  <svg class="sky" viewBox="0 0 1000 700" aria-hidden="true" focusable="false">
    <g>
      <line x1="94" y1="165" x2="221" y2="103" />
      <line x1="221" y1="103" x2="328" y2="210" />
      <line x1="328" y1="210" x2="452" y2="111" />
      <line x1="690" y1="118" x2="825" y2="178" />
      <line x1="825" y1="178" x2="906" y2="94" />
      <line x1="108" y1="488" x2="238" y2="562" />
      <line x1="238" y1="562" x2="373" y2="501" />
      <line x1="373" y1="501" x2="490" y2="601" />
      <line x1="700" y1="528" x2="816" y2="596" />
      <line x1="816" y1="596" x2="931" y2="479" />
    </g>
    <g>
      <circle class="halo" cx="221" cy="103" r="28" />
      <circle class="halo" cx="816" cy="596" r="32" />
      <circle class="halo" cx="825" cy="178" r="21" />
      <circle class="star" cx="94" cy="165" r="2.5" />
      <circle class="star" cx="221" cy="103" r="4.5" />
      <circle class="star" cx="328" cy="210" r="3" />
      <circle class="star" cx="452" cy="111" r="2" />
      <circle class="star" cx="690" cy="118" r="2.5" />
      <circle class="star" cx="825" cy="178" r="4" />
      <circle class="star" cx="906" cy="94" r="2.5" />
      <circle class="star" cx="108" cy="488" r="3" />
      <circle class="star" cx="238" cy="562" r="4" />
      <circle class="star" cx="373" cy="501" r="2.5" />
      <circle class="star" cx="490" cy="601" r="3" />
      <circle class="star" cx="700" cy="528" r="2.5" />
      <circle class="star" cx="816" cy="596" r="4.5" />
      <circle class="star" cx="931" cy="479" r="3" />
    </g>
  </svg>
  <main class="panel">
    <div class="symbol" aria-hidden="true">✦</div>

    <h1>Coming soon.</h1>
    <div class="accent" aria-hidden="true"></div>
    <h2>まだ見えない光が、<br>ここからつながっていく。</h2>
    <p class="description">公開まで、もうしばらくお待ちください。</p>
    <div class="project"><strong>みんなでつくる「見えない病気の星図」</strong></div>
    <p class="footnote"><a href="./privacy/">プライバシーポリシー</a></p>
  </main>
</body>
</html>
